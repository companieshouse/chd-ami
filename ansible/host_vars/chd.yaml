---

selinux_status:
  - policy: targeted
    state: permissive

users:
  - name: chd
    group: chlservices
    gid: 600
  - name: bulkdata
    group: bulkdata
    gid: 601
    
app_user_home_path: /home/chd

s3_file_perl_lib: /application/shared/libraries/perl-xerces-lib.tar.gz
s3_file_perl_lib_name: '{{ s3_file_perl_lib | basename }}'

tar_files:
  - "{{ s3_file_perl_lib_name }}"

install_watcher_service: true

postfix_main_config_file: main.cf
postfix_config:
  - key: mydomain
    value: companieshouse.gov.uk
  - key: myorigin 
    value: $mydomain
  - key: relayhost
    value: smtp-outbound.sharedservices.aws.internal

postfix_net_config:
  - key: inet_interfaces 
    value: all
  - key: inet_protocols 
    value: ipv4

## FTP Server
ftp_server_package: "vsftpd"
ftp_server_service: "{{ ftp_server_package }}"

## clamav_ng Variables
clamav_ng_freshclam_privatemirror: clamav-mirror.sharedservices.aws.internal
